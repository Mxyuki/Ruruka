# <-- Options du lecteur Ruruka. Le mpv personnel de l'utilisateur n'est jamais touché -->
osc=no
osd-bar=no
title-bar=no
cursor-autohide=1200
autofit-larger=90%x90%

vo=gpu-next
hwdec=auto-safe

# Pistes par défaut pour de l'anime : japonais et sous-titres français, sinon anglais
alang=jpn,ja,jp
slang=fre,fra,fr,eng,en
sub-auto=fuzzy

osd-fonts-dir=~~/fonts
osd-font=Nunito ExtraBold
osd-font-size=32
osd-color=#fbf7ef
osd-outline-color=#2b1e30
osd-outline-size=2

# <-- Lecture fluide depuis un disque lent : mpv lit plusieurs secondes d'avance en mémoire, une pause du disque ne se voit plus -->
cache=yes
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=64MiB
demuxer-readahead-secs=40

# <-- Captures : PNG pleine résolution, compression légère pour que le cliché soit prêt aussitôt -->
screenshot-format=png
screenshot-png-compression=1
