# <-- Options du lecteur Ruruka. Le mpv personnel de l'utilisateur n'est jamais touché -->
osc=no
osd-bar=no
title-bar=no
cursor-autohide=1200
autofit-larger=90%x90%

vo=gpu-next
hwdec=auto-safe

# Pistes par défaut pour de l'anime : japonais et sous-titres français, sinon anglais
alang=jpn,ja,jp
slang=fre,fra,fr,eng,en
sub-auto=fuzzy

osd-fonts-dir=~~/fonts
osd-font=Nunito ExtraBold
osd-font-size=32
osd-color=#fbf7ef
osd-outline-color=#2b1e30
osd-outline-size=2
